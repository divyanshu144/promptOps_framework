[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptops"
version = "0.1.0"
description = "LLM evaluation and prompt observability with CI quality gates and MLflow tracking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "jsonschema>=4",
  "httpx>=0.27",
  "typer>=0.12",
  "mlflow>=2.10",
  "python-dotenv>=1.0",
  "openai>=1.30",
  "anthropic>=0.28",
  "deepeval>=0.21",
]

[project.scripts]
promptops = "promptops.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptops*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q -m \"not deepeval\""
markers = [
  "deepeval: marks tests as DeepEval integration evals (require Ollama running)",
]
